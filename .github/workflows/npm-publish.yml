name: React Frontend CI/CD

on:
  push:
    branches: [ smmoon ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
          CI: false

      # 1. 기존 폴더를 일반 폴더로 백업 (압축 안 함)
      - name: Backup Current Folder
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          script: |
            sudo mkdir -p /var/www/frontend_backups
            if [ -d "/var/www/html" ]; then
              # 날짜별 폴더로 통째로 복사
              sudo cp -r /var/www/html /var/www/frontend_backups/html_$(date +%Y%m%d_%H%M%S)
              echo "Backup folder created in /var/www/frontend_backups"
            fi

      # 2. 새로운 빌드 파일 전송 (기존 html 폴더 내용을 덮어씌움)
      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          source: "build/*"
          target: "/var/www/html"
          strip_components: 1
          overwrite: true

      # 3. Nginx 재시작 (권한 확인 포함)
      - name: Post Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          script: |
              sudo chown -R user:user /var/www/html
              sudo find /var/www/html -exec touch {} +
              sudo systemctl restart nginx

