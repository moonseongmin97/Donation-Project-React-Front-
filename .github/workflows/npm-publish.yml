name: React Frontend CI/CD

on:
  push:
    branches: [ smmoon ] # 브랜치 smmoon으로 설정

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install & Build
        run: |
          npm install
          npm run build
        env:
          CI: false

      # 1. 기존 html 폴더를 frontend_backups 내부로 시간까지 포함하여 이동(백업)
      - name: Backup to dedicated folder
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222 # SSH 포트 2222 유지
          script: |
            # 백업 전용 폴더 생성
            sudo mkdir -p /var/www/frontend_backups
            
            if [ -d "/var/www/html" ]; then
              # 연월일_시분초 형식으로 백업하여 중복 방지 (예: html_20260130_192005)
              BACKUP_NAME="html_$(date +%Y%m%d_%H%M%S)"
              sudo mv /var/www/html "/var/www/frontend_backups/$BACKUP_NAME"
              echo "Backup created: /var/www/frontend_backups/$BACKUP_NAME"
            fi
            
            # 새 파일을 전송받을 깨끗한 html 폴더 생성 및 권한 설정
            sudo mkdir -p /var/www/html
            sudo chown -R ${{ secrets.USERNAME }}:${{ secrets.USERNAME }} /var/www/html

      # 2. 새로운 빌드 파일 전송 (build 폴더 내용물만 전송)
      - name: Deploy to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          source: "build/*" # 빌드 폴더명 build 확인
          target: "/var/www/html"
          strip_components: 1
          overwrite: true

      # 3. 권한 정리, 날짜 강제 갱신 및 Nginx 재시작
      - name: Post Deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          script: |
            # 권한을 user로 재설정
            sudo chown -R user:user /var/www/html
            # 서버 시간이 UTC라도, 파일들의 수정 시간을 배포 시점(현재)으로 강제 갱신
            sudo find /var/www/html -exec touch {} +
            # Nginx 재시작
            sudo systemctl restart nginx
            echo "Deployment and time-stamp update completed."